<!doctype html><html lang="en"><meta charset="utf-8"><title>Military symbol validation</title>
<link rel="stylesheet" href="styles.css"><style>body{display:block;padding:24px;background:#18212b;color:white;font:14px Arial}#grid{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:12px}.sample{padding:16px;background:#253443;min-height:96px}.sample img{width:48px;height:48px;display:block}#status{font-size:20px}</style>
<h1>mil-sym-ts 2.10.8 — mapping preview</h1><p id="status">Rendering…</p><p>Columns: unknown, friendly, neutral, hostile. Generic point symbols retain the descriptive labels shown below.</p><div id="grid"></div>
<script src="vendor/mil-sym-ts/C5Ren.umd.js"></script><script src="mil_sym_adapter.js"></script><script>
(async()=>{let count=0;const images=[];for(const key of Object.keys(MilitarySymbols.registry)){for(const affiliation of ["unknown","friendly","neutral","hostile"]){const r=MilitarySymbols.render(key,affiliation);if(!r)throw Error("Render failed: "+key);const box=document.createElement("div");box.className="sample";const img=document.createElement("img");img.alt=key+" "+affiliation;img.src=r.uri;box.append(img,document.createTextNode(key+" / "+affiliation));grid.append(box);images.push(img.decode());count++;}}await Promise.all(images);if(MilitarySymbols.render("unmapped","unknown")!==null)throw Error("Fallback failed");document.getElementById("status").textContent="PASS — "+count+" SVG symbols rendered and decoded; unknown mapping safely rejected.";})().catch(e=>document.getElementById("status").textContent="FAIL — "+e.message);
</script></html>
